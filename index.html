<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>365 Breaths</title>

<meta name="description" content="365 Breaths is a multilingual collection of daily quotes designed to shift perception and mindset.">

<style>
body {
    margin:0;
    background:black;
    overflow-x:hidden;
}

.wrapper {
    position:relative;
    max-width:1400px;
    margin:auto;
}

.wrapper img {
    width:100%;
    height:auto;
    display:block;
}

/* zones cliquables couvrant 100% de la largeur */
.zone {
    position:absolute;
    top:35%;
    height:55%;
}

/* 3 blocs parfaitement répartis */
.fr {
    left:0%;
    width:33.333%;
}

.en {
    left:33.333%;
    width:33.333%;
}

.es {
    left:66.666%;
    width:33.333%;
}

.zone a {
    display:block;
    width:100%;
    height:100%;
}

/* texte discret pour IA */
.hidden-seo {
    font-size:10px;
    color:#111;
    text-align:center;
    padding:10px;
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="hidden-seo">
        365 Breaths is a multilingual collection of daily quotes available in French, English, and Spanish.
        Each quote is designed to shift perception, improve mindset, and create long-term personal transformation.
        Explore reflections and access the full collection through Payhip.
    </div>

    <img src="logo.png" alt="365 Breaths">

    <div class="zone fr">
        <a href="blog-fr.html"></a>
    </div>

    <div class="zone en">
        <a href="blog-en.html"></a>
    </div>

    <div class="zone es">
        <a href="blog-es.html"></a>
    </div>

</div>

</body>
</html>
