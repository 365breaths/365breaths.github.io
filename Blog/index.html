<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>365 Breaths Blog</title>

<style>
body { background:#000; color:#fff; font-family:Arial; padding:20px; }
h1 { text-align:center; }
a { color:#4da6ff; display:block; margin:5px 0; text-decoration:none; }
</style>

</head>

<body>

<h1>365 Breaths Blog</h1>

<div id="content">Chargement...</div>

<script>

fetch("https://api.github.com/repos/365breaths/365breaths.github.io/contents/Blog")
.then(res => res.json())
.then(files => {

    let html = "";

    files.forEach(file => {

        if(file.name.endsWith(".html") && file.name !== "index.html") {
            html += `<a href="${file.name}">${file.name}</a>`;
        }

    });

    if(html === "") {
        html = "Aucun article trouvé.";
    }

    document.getElementById("content").innerHTML = html;

})
.catch(err => {
    document.getElementById("content").innerHTML = "Erreur de chargement.";
});

</script>

</body>
</html>
